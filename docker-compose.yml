services:
  claude-proxy:
    build:
      context: .
      args:
        BLUESHIP_REV: ${BLUESHIP_REV:-7050adb8f9c6f8140e13cac4a8f4841d758dceb1}
    image: claude-proxy:latest
    container_name: claude-proxy
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    environment:
      PROXY_API_KEY: ${PROXY_API_KEY:?set PROXY_API_KEY in .env}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-4-5-20250929}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-300s}
      TOKEN_FILE: /data/anthropic-tokens.json
    volumes:
      - ./data:/data
    # /readyz, not /healthz: the process staying up says nothing about whether
    # the OAuth pair is still good. This goes red when the refresh chain breaks,
    # which is the failure that otherwise only shows up as client-side 502s.
    # Nothing restarts on it — a dead refresh token needs an interactive login,
    # not a bounce — it is there so `docker compose ps` tells the truth.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
